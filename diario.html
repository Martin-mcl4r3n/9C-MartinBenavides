<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Bordo | Tokyo Drift Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* CONFIGURACIÓN DE COLORES Y ESTILOS GLOBALES DEL SITIO */
        :root {
            --bg-color: #0a0a0f;
            --text-color: #ffffff;
            --accent-pink: #ff0055;
            --accent-green: #39ff14;
            --accent-cyan: #00f0ff;
            --card-bg: rgba(18, 18, 26, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 0, 85, 0.15), transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* HEADER Y TITULOS */
        .contenedor-titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 3px;
            color: var(--text-color);
            text-shadow: 
                0 0 5px #fff,
                0 0 10px var(--accent-pink),
                0 0 20px var(--accent-pink);
        }

        .contenedor-diario {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
            padding: 25px;
        }

        /* FORMULARIO DE ENTRADAS */
        .form-diario {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--accent-pink);
            padding-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-cyan);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--accent-cyan);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* BOTONES GLOBALES DEL SITIO */
        .botones-container {
            display: flex;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }

        .boton_1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 10px 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            transform: skewX(-12deg);
            text-decoration: none;
            display: inline-block;
        }

        .boton_1 span {
            display: inline-block;
            transform: skewX(12deg);
        }

        .boton_1:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 20px var(--accent-green);
            transform: skewX(-12deg) scale(1.05);
        }

        .btn-menu {
            border-color: var(--accent-pink);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .btn-menu:hover {
            background: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 20px var(--accent-pink);
        }

        .btn-borrar {
            border-color: #ff3939;
            box-shadow: 0 0 10px rgba(255, 57, 57, 0.4);
            font-size: 0.75rem;
            padding: 6px 12px;
            margin-top: 10px;
        }

        .btn-borrar:hover {
            background: #ff3939;
            color: #fff;
            box-shadow: 0 0 15px #ff3939;
        }

        /* LISTA DE ENTRADAS */
        .lista-entradas {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-entrada {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            padding: 15px;
            position: relative;
        }

        .header-entrada {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(57, 255, 20, 0.3);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .titulo-entrada {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-green);
            font-size: 1.2rem;
        }

        .fecha-entrada {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            font-family: 'Orbitron', sans-serif;
        }

        .contenido-entrada {
            color: #d1d5db;
            font-size: 1.05rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .titulo {
                font-size: 1.8rem;
            }
            .botones-container {
                flex-direction: column;
                gap: 10px;
            }
            .boton_1 {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <main class="contenedor-diario">
        <header class="contenedor-titulo">
            <h1 class="titulo">Diario de Bordo</h1>
        </header>

        <form class="form-diario" id="form-diario">
            <div class="form-group">
                <label for="titulo-diario">TÍTULO DE LA BITÁCORA:</label>
                <input type="text" id="titulo-diario" placeholder="Ej: Prueba del MS Hypercar..." required>
            </div>

            <div class="form-group">
                <label for="fecha-diario">FECHA:</label>
                <input type="date" id="fecha-diario" required>
            </div>

            <div class="form-group">
                <label for="contenido-diario">NOTAS / REGISTRO:</label>
                <textarea id="contenido-diario" rows="4" placeholder="Escribe tus notas, tuning o ideas..." required></textarea>
            </div>

            <div class="botones-container">
                <button type="submit" class="boton_1"><span>Guardar Bitácora</span></button>
                <a href="menu.html" class="boton_1 btn-menu"><span>Volver al Menú</span></a>
            </div>
        </form>

        <h3 style="font-family: 'Orbitron'; color: var(--accent-pink); margin-bottom: 15px;">REGISTROS GUARDADOS</h3>
        <div class="lista-entradas" id="lista-entradas">
            </div>
    </main>

    <script>
        const formDiario = document.getElementById('form-diario');
        const listaEntradas = document.getElementById('lista-entradas');

        // Acceso restringido: si no hay sesión activa, redirigir al login
        if (!localStorage.getItem('usuarioPiloto')) {
            window.location.replace('Registro.html');
        }

        // Cargar entradas guardadas desde localStorage
        function cargarEntradas() {
            listaEntradas.innerHTML = '';
            const entradas = JSON.parse(localStorage.getItem('diarioBitacoras')) || [];

            if (entradas.length === 0) {
                listaEntradas.innerHTML = '<p style="color: #888;">No hay bitácoras registradas aún.</p>';
                return;
            }

            entradas.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card-entrada';

                const header = document.createElement('div');
                header.className = 'header-entrada';

                const spanTitulo = document.createElement('span');
                spanTitulo.className = 'titulo-entrada';
                spanTitulo.textContent = item.titulo;

                const spanFecha = document.createElement('span');
                spanFecha.className = 'fecha-entrada';
                spanFecha.textContent = item.fecha;

                header.appendChild(spanTitulo);
                header.appendChild(spanFecha);

                const divContenido = document.createElement('div');
                divContenido.className = 'contenido-entrada';
                divContenido.textContent = item.contenido;

                const btnBorrar = document.createElement('button');
                btnBorrar.className = 'boton_1 btn-borrar';
                btnBorrar.innerHTML = '<span>Eliminar</span>';
                btnBorrar.addEventListener('click', () => borrarEntrada(index));

                card.appendChild(header);
                card.appendChild(divContenido);
                card.appendChild(btnBorrar);
                listaEntradas.appendChild(card);
            });
        }

        // Agregar una nueva entrada
        formDiario.addEventListener('submit', (e) => {
            e.preventDefault();
            const titulo = document.getElementById('titulo-diario').value.trim();
            const fecha = document.getElementById('fecha-diario').value;
            const contenido = document.getElementById('contenido-diario').value.trim();

            const entradas = JSON.parse(localStorage.getItem('diarioBitacoras')) || [];
            entradas.unshift({ titulo, fecha, contenido }); // Agregar al inicio de la lista

            localStorage.setItem('diarioBitacoras', JSON.stringify(entradas));
            formDiario.reset();
            cargarEntradas();
        });

        // Eliminar una entrada existente
        function borrarEntrada(index) {
            const entradas = JSON.parse(localStorage.getItem('diarioBitacoras')) || [];
            entradas.splice(index, 1);
            localStorage.setItem('diarioBitacoras', JSON.stringify(entradas));
            cargarEntradas();
        }

        // Inicializar la carga al abrir la página
        cargarEntradas();
    </script>
</body>
</html>
